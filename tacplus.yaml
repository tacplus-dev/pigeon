kind: service
# The compiler floor: the looper runs the latest patch of this MAJOR.MINOR.
tacplus: "2.4"
language: go
src: proto
# The pigeon talks to its dog on the coop's thread topic, which publishes
# through the eventbus broker.
depends:
  - coop
  - eventbus
# pkg is derived from go.mod (the org name has a hyphen, which pkg cannot carry).
# A derived Go package is <module>/tacplus, so the output segment must be "tacplus".
output-dir: tacplus
output-name: tacplus
